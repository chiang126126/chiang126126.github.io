name: Sync million-path → standalone repo

# 把 million-path/ 同步到独立仓库 chiang126126/million-path（看板源）。
# 关键：只同步【代码】，保留独立仓库里的【实时数据】（ledger/events/bot_*/reviews/config），
# 避免覆盖用户与机器人累积的数据。
on:
  push:
    branches: [claude/trusting-pasteur-el5wv5, main]
    paths: ["million-path/**"]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync code, preserve live data
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::缺少 SYNC_TOKEN"; exit 1; fi
          git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/chiang126126/million-path.git" dest

          # 这些是「实时数据」，已存在则保留，不被源覆盖（config.js 改为由源仓库统一管理）
          PRESERVE="data/ledger.json data/events.json \
                    data/bot_state.json data/bot_trades.json data/bot_log.json"

          # 1) 同步代码（--delete 清理已删文件），但排除受保护文件与 reviews/
          # --checksum 必须加：CI 里 checkout 与 clone 的 mtime 同秒，同字节数的改动
          # （如缓存版本号 v48→v49）会被 rsync 快速校验误判为"未变化"而漏同步
          rsync -a --delete --checksum \
            --exclude '.git' --exclude 'reviews/' \
            --exclude 'data/sim_*' --exclude 'data/klines_*' \
            $(for f in $PRESERVE; do echo --exclude "$f"; done) \
            million-path/ dest/

          # 2) 仅当目标缺失时，用源里的版本做初始种子
          for f in $PRESERVE; do
            if [ ! -f "dest/$f" ]; then mkdir -p "dest/$(dirname "$f")"; cp "million-path/$f" "dest/$f"; fi
          done
          mkdir -p dest/reviews/trades

          cd dest
          git config user.name "million-path-sync"
          git config user.email "mangzi141800@gmail.com"
          git add -A
          git commit -q -m "Sync code from ${GITHUB_SHA::7} (data preserved)" || { echo "no changes"; exit 0; }
          git push origin HEAD:main
          echo "✅ 已同步代码（实时数据保留）"
