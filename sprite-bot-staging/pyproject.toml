[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sprite-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sprite-catcher @ git+https://github.com/chiang126126/sprite-catcher.git",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio", "responses>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
