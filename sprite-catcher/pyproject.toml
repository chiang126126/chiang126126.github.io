[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-catcher"
version = "0.1.0"
description = "精灵捕手 — Sprite Catcher L2 feature engineering for the Crésus altcoin trading system"
requires-python = ">=3.10"
license = { text = "MIT" }
# 纯 stdlib，零运行时依赖
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["sprite_catcher*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"sprite_catcher.datasets" = ["*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
